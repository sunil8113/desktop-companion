<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Original cartoon speedster. Faces left, mid-stride; the front fist (left) holds the prop. -->
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e2500f"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fff4"/>
      <stop offset="1" stop-color="#17b8a6"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="124" cy="291" rx="84" ry="7" fill="#000" opacity="0.2"/>

  <!-- speed lines streaming behind -->
  <g stroke-linecap="round" fill="none">
    <path d="M198 128 L236 128" stroke="#ffd23f" stroke-width="5"/>
    <path d="M204 156 L238 156" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    <path d="M196 214 L232 214" stroke="#ffd23f" stroke-width="5"/>
    <path d="M206 240 L236 240" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- back leg, pushing off -->
  <path d="M134 212 C150 234 164 248 180 258" fill="none" stroke="#7a2a00" stroke-width="27" stroke-linecap="round"/>
  <path d="M134 212 C150 234 164 248 180 258" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <ellipse cx="192" cy="266" rx="17" ry="10" fill="#ffffff" stroke="#5b6478" stroke-width="3" transform="rotate(28 192 266)"/>
  <path d="M184 262 L198 272" stroke="#ff8a2a" stroke-width="4" stroke-linecap="round"/>

  <!-- back arm, pumping -->
  <path d="M146 142 C164 152 174 166 182 180" fill="none" stroke="#7a2a00" stroke-width="22" stroke-linecap="round"/>
  <path d="M146 142 C164 152 174 166 182 180" fill="none" stroke="url(#suit)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="186" cy="186" r="11" fill="#ffffff" stroke="#5b6478" stroke-width="3"/>

  <!-- front leg, striding -->
  <path d="M108 212 C98 234 86 252 78 272" fill="none" stroke="#7a2a00" stroke-width="27" stroke-linecap="round"/>
  <path d="M108 212 C98 234 86 252 78 272" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <ellipse cx="68" cy="282" rx="19" ry="10" fill="#ffffff" stroke="#5b6478" stroke-width="3"/>
  <path d="M56 282 L78 282" stroke="#ff8a2a" stroke-width="4" stroke-linecap="round"/>

  <!-- torso -->
  <path d="M90 140 C92 128 104 122 120 122 C138 122 150 130 150 142 L146 204 C146 216 136 222 120 222 C104 222 94 216 94 204 Z" fill="url(#suit)" stroke="#7a2a00" stroke-width="3"/>
  <path d="M98 148 L108 170 L100 176 L110 202" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chest emblem: double chevron -->
  <g fill="none" stroke="#ffd23f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 156 L120 168 L132 180"/>
    <path d="M144 156 L132 168 L144 180"/>
  </g>
  <rect x="94" y="196" width="52" height="10" rx="4" fill="#ffffff" stroke="#5b6478" stroke-width="2"/>

  <!-- front arm, forward (holds the prop) -->
  <path d="M96 142 C80 148 66 158 58 170" fill="none" stroke="#7a2a00" stroke-width="22" stroke-linecap="round"/>
  <path d="M96 142 C80 148 66 158 58 170" fill="none" stroke="url(#suit)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="52" cy="174" r="11" fill="#ffffff" stroke="#5b6478" stroke-width="3"/>

  <!-- head: hood with swept-back fin -->
  <path d="M150 66 L184 52 L170 70 L196 68 L158 92 Z" fill="#ffffff" stroke="#5b6478" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="116" cy="84" r="44" fill="url(#suit)" stroke="#7a2a00" stroke-width="3"/>
  <path d="M82 90 C84 116 98 128 116 128 C134 128 148 116 150 90 Z" fill="#f6c9a0" stroke="#c98f63" stroke-width="2"/>
  <!-- goggles -->
  <rect x="72" y="70" width="86" height="22" rx="11" fill="#1d2433"/>
  <rect x="79" y="73" width="32" height="16" rx="8" fill="url(#lens)"/>
  <rect x="119" y="73" width="32" height="16" rx="8" fill="url(#lens)"/>
  <path d="M84 78 L94 76 M124 78 L134 76" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- grin -->
  <path d="M102 108 Q116 122 130 108 Z" fill="#ffffff" stroke="#7a2b1f" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="92" cy="104" rx="7" ry="4" fill="#ff7aa8" opacity="0.4"/>
  <ellipse cx="140" cy="104" rx="7" ry="4" fill="#ff7aa8" opacity="0.4"/>
</svg>
