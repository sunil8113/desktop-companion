<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Original cartoon star wizard with a red cape and a crystal staff. The open left hand holds the prop. -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d52d6"/>
      <stop offset="1" stop-color="#3b1f7a"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a42c4"/>
      <stop offset="1" stop-color="#2e1764"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2342c"/>
      <stop offset="1" stop-color="#9a1414"/>
    </linearGradient>
    <radialGradient id="crystal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#36c7f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="124" cy="292" rx="84" ry="7" fill="#000" opacity="0.22"/>

  <!-- red cape, behind the robe and staff -->
  <path d="M90 138 C68 186 46 238 34 288 L206 288 C194 238 172 186 150 138 Z" fill="url(#cape)" stroke="#5e0b0b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 170 C70 210 58 248 50 282 M156 170 C170 210 182 248 190 282" fill="none" stroke="#7a1212" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- staff -->
  <circle cx="198" cy="44" r="30" fill="url(#crystal-glow)"/>
  <rect x="194" y="58" width="9" height="232" rx="4" fill="#7a4a26" stroke="#3e2410" stroke-width="2"/>
  <path d="M190 60 C188 52 192 48 198 50 C204 48 208 52 206 60" fill="none" stroke="#3e2410" stroke-width="3" stroke-linecap="round"/>
  <polygon points="198,22 210,42 198,60 186,42" fill="#aef4ff" stroke="#1f8fb8" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M198 26 L198 56 M190 42 L206 42" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- shoes -->
  <ellipse cx="100" cy="286" rx="16" ry="7" fill="#2e1764" stroke="#170a36" stroke-width="2"/>
  <ellipse cx="142" cy="286" rx="16" ry="7" fill="#2e1764" stroke="#170a36" stroke-width="2"/>

  <!-- robe -->
  <path d="M88 146 C78 196 68 246 62 284 L180 284 C174 246 164 196 152 146 Z" fill="url(#robe)" stroke="#24104f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 276 L178 276" stroke="#ffd23f" stroke-width="5"/>
  <path d="M120 150 L120 274" stroke="#ffd23f" stroke-width="3" opacity="0.7"/>
  <g fill="#ffd23f">
    <path d="M90 230 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 Z"/>
    <path d="M146 210 l2.5 5.5 6 1 -4.5 4 1 6 -5 -2.5 -5 2.5 1 -6 -4.5 -4 6 -1 Z"/>
    <circle cx="104" cy="196" r="2.5"/>
    <circle cx="140" cy="250" r="2.5"/>
    <circle cx="156" cy="180" r="2"/>
  </g>
  <rect x="88" y="172" width="64" height="9" rx="4" fill="#ffd23f" stroke="#b88a00" stroke-width="2"/>

  <!-- right sleeve, holding the staff -->
  <path d="M150 154 C166 162 180 172 190 180" fill="none" stroke="#24104f" stroke-width="30" stroke-linecap="round"/>
  <path d="M150 154 C166 162 180 172 190 180" fill="none" stroke="url(#robe)" stroke-width="24" stroke-linecap="round"/>
  <circle cx="198" cy="182" r="11" fill="#f3c7a2" stroke="#c98f63" stroke-width="2"/>

  <!-- left sleeve, open hand (holds the prop) -->
  <path d="M90 154 C76 166 64 176 56 184" fill="none" stroke="#24104f" stroke-width="30" stroke-linecap="round"/>
  <path d="M90 154 C76 166 64 176 56 184" fill="none" stroke="url(#robe)" stroke-width="24" stroke-linecap="round"/>
  <path d="M60 178 L52 190" stroke="#ffd23f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="44" cy="190" r="11" fill="#f3c7a2" stroke="#c98f63" stroke-width="2"/>
  <g fill="none" stroke="#aef4ff" stroke-width="2.5" stroke-linecap="round">
    <path d="M28 170 L28 178 M24 174 L32 174"/>
    <path d="M56 160 L56 166 M53 163 L59 163"/>
  </g>

  <!-- head -->
  <circle cx="120" cy="108" r="38" fill="#f3c7a2" stroke="#c98f63" stroke-width="2"/>
  <!-- beard -->
  <path d="M84 110 C82 150 98 196 120 214 C142 196 158 150 156 110 C146 128 136 134 120 134 C104 134 94 128 84 110 Z" fill="#f4f6fa" stroke="#aab3c4" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M110 150 C112 170 116 188 120 200 M130 150 C128 170 124 188 120 200" fill="none" stroke="#c6cdd9" stroke-width="2" stroke-linecap="round"/>
  <!-- moustache -->
  <path d="M100 126 C108 118 116 120 120 125 C124 120 132 118 140 126 C132 132 124 130 120 127 C116 130 108 132 100 126 Z" fill="#ffffff" stroke="#aab3c4" stroke-width="1.5"/>
  <!-- nose, eyes, brows -->
  <circle cx="120" cy="114" r="6" fill="#eaa985"/>
  <path d="M100 104 Q106 98 112 104 M128 104 Q134 98 140 104" fill="none" stroke="#3a2a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M96 94 C102 88 110 88 114 92 M126 92 C130 88 138 88 144 94" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- hat -->
  <path d="M80 82 C94 58 104 30 126 8 C134 4 150 12 156 22 C146 20 140 22 138 30 C140 50 150 66 162 82 Z" fill="url(#hat)" stroke="#170a36" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="120" cy="84" rx="62" ry="12" fill="#3b1f7a" stroke="#170a36" stroke-width="3"/>
  <path d="M86 74 C104 68 136 68 156 74" fill="none" stroke="#ffd23f" stroke-width="5" stroke-linecap="round"/>
  <g fill="#ffd23f">
    <path d="M118 40 l2.5 5.5 6 1 -4.5 4 1 6 -5 -2.5 -5 2.5 1 -6 -4.5 -4 6 -1 Z"/>
    <circle cx="104" cy="58" r="2.5"/>
    <circle cx="136" cy="54" r="2"/>
  </g>
</svg>
