<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Original cartoon web-slinging hero. Hangs from the web by the raised hand (top centre). -->
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3d85"/>
      <stop offset="1" stop-color="#1a2557"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
  </defs>

  <!-- legs, dangling -->
  <path d="M108 204 C104 226 96 240 100 262" fill="none" stroke="#0b1430" stroke-width="27" stroke-linecap="round"/>
  <path d="M108 204 C104 226 96 240 100 262" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <path d="M134 204 C142 224 150 234 150 252" fill="none" stroke="#0b1430" stroke-width="27" stroke-linecap="round"/>
  <path d="M134 204 C142 224 150 234 150 252" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <ellipse cx="101" cy="272" rx="14" ry="10" fill="#14c2b0" stroke="#0a7d72" stroke-width="3"/>
  <ellipse cx="152" cy="262" rx="14" ry="10" fill="#14c2b0" stroke="#0a7d72" stroke-width="3" transform="rotate(-20 152 262)"/>

  <!-- raised arm holding the web (drawn behind the head) -->
  <path d="M142 134 C146 100 132 58 122 26" fill="none" stroke="#0b1430" stroke-width="24" stroke-linecap="round"/>
  <path d="M142 134 C146 100 132 58 122 26" fill="none" stroke="url(#suit)" stroke-width="18" stroke-linecap="round"/>
  <path d="M126 40 L121 28" stroke="#14c2b0" stroke-width="20" stroke-linecap="round"/>
  <circle cx="120" cy="18" r="12" fill="#14c2b0" stroke="#0a7d72" stroke-width="3"/>

  <!-- torso -->
  <path d="M92 132 C92 120 104 114 120 114 C136 114 148 120 148 132 L146 196 C146 210 136 216 120 216 C104 216 94 210 94 196 Z" fill="url(#suit)" stroke="#0b1430" stroke-width="3"/>
  <path d="M96 150 L96 192 M144 150 L144 192" stroke="#14c2b0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <polygon points="120,138 131,144 131,157 120,163 109,157 109,144" fill="#14c2b0" stroke="#0a7d72" stroke-width="2.5"/>
  <circle cx="120" cy="150.5" r="4" fill="#0b1430"/>
  <rect x="94" y="188" width="52" height="10" rx="4" fill="#14c2b0" stroke="#0a7d72" stroke-width="2"/>
  <rect x="113" y="186" width="14" height="14" rx="3" fill="#ffd23f" stroke="#c99a00" stroke-width="2"/>

  <!-- free arm, held out (holds the water bottle) -->
  <path d="M98 136 C80 142 62 148 44 150" fill="none" stroke="#0b1430" stroke-width="24" stroke-linecap="round"/>
  <path d="M98 136 C80 142 62 148 44 150" fill="none" stroke="url(#suit)" stroke-width="18" stroke-linecap="round"/>
  <path d="M56 149 L46 150" stroke="#14c2b0" stroke-width="20" stroke-linecap="round"/>
  <circle cx="34" cy="150" r="12" fill="#14c2b0" stroke="#0a7d72" stroke-width="3"/>
  <ellipse cx="38" cy="139" rx="5" ry="7" fill="#14c2b0" stroke="#0a7d72" stroke-width="2.5" transform="rotate(25 38 139)"/>

  <!-- head -->
  <circle cx="110" cy="84" r="42" fill="url(#suit)" stroke="#0b1430" stroke-width="3"/>
  <path d="M69 78 C71 52 89 42 110 42 C131 42 149 52 151 78 C139 69 125 65 110 65 C95 65 81 69 69 78 Z" fill="#14c2b0" stroke="#0a7d72" stroke-width="2.5"/>
  <path d="M72 86 C86 77 134 77 148 86 L146 102 C132 111 88 111 74 102 Z" fill="url(#visor)" stroke="#c99a00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 89 L102 86" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M99 115 Q110 122 121 115" fill="none" stroke="#56689f" stroke-width="3.5" stroke-linecap="round"/>
</svg>
