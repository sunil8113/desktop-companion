<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Original cartoon hooded archer. The raised hand (top centre) grips the zip line;
       the outstretched left hand holds the prop. -->
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9c84"/>
      <stop offset="1" stop-color="#155c4e"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0683a"/>
      <stop offset="1" stop-color="#6b4221"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="292" rx="72" ry="7" fill="#000" opacity="0.22"/>

  <!-- quiver behind the shoulder -->
  <rect x="62" y="100" width="22" height="78" rx="6" fill="url(#leather)" stroke="#3e2410" stroke-width="2.5" transform="rotate(-18 73 139)"/>
  <g stroke="#3e2410" stroke-width="2" stroke-linejoin="round">
    <path d="M60 104 L50 84 L62 90 Z" fill="#e8322f"/>
    <path d="M70 100 L64 78 L74 86 Z" fill="#ffd23f"/>
    <path d="M80 98 L78 76 L86 86 Z" fill="#e8322f"/>
  </g>

  <!-- short cloak behind -->
  <path d="M94 124 C80 160 76 200 82 232 L158 232 C164 200 160 160 146 124 Z" fill="url(#cloak)" stroke="#0c3a31" stroke-width="3" stroke-linejoin="round"/>

  <!-- legs & tall boots -->
  <rect x="98" y="212" width="20" height="40" rx="6" fill="#5a4a3a" stroke="#2a2016" stroke-width="2.5"/>
  <rect x="122" y="212" width="20" height="40" rx="6" fill="#5a4a3a" stroke="#2a2016" stroke-width="2.5"/>
  <path d="M95 246 L121 246 L120 280 C120 286 114 288 104 288 C94 288 92 284 94 278 Z" fill="url(#leather)" stroke="#3e2410" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M119 246 L145 246 L146 278 C148 284 146 288 136 288 C126 288 120 286 120 280 Z" fill="url(#leather)" stroke="#3e2410" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- raised arm gripping the line (behind the head) -->
  <path d="M142 134 C148 100 134 60 124 30" fill="none" stroke="#0c3a31" stroke-width="24" stroke-linecap="round"/>
  <path d="M142 134 C148 100 134 60 124 30" fill="none" stroke="url(#cloak)" stroke-width="18" stroke-linecap="round"/>
  <path d="M128 44 L124 32" stroke="url(#leather)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="122" cy="20" r="12" fill="#e9b58e" stroke="#b88660" stroke-width="2"/>

  <!-- tunic -->
  <path d="M94 132 C94 120 104 116 120 116 C136 116 146 120 146 132 L146 206 C146 214 140 218 132 218 L108 218 C100 218 94 214 94 206 Z" fill="url(#leather)" stroke="#3e2410" stroke-width="3"/>
  <path d="M120 132 L120 188" stroke="#3e2410" stroke-width="2" stroke-dasharray="4 5" opacity="0.6"/>
  <!-- bow slung across the chest -->
  <path d="M92 128 C122 140 146 176 150 214" fill="none" stroke="#3e2410" stroke-width="7" stroke-linecap="round"/>
  <path d="M92 128 C122 140 146 176 150 214" fill="none" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 128 L150 214" stroke="#f4ead2" stroke-width="1.5"/>
  <rect x="94" y="190" width="52" height="10" rx="4" fill="#3e2410" stroke="#22140a" stroke-width="2"/>
  <rect x="114" y="188" width="12" height="14" rx="3" fill="#ffd23f" stroke="#b88a00" stroke-width="2"/>

  <!-- free arm, held out (holds the prop) -->
  <path d="M98 138 C82 148 66 158 52 164" fill="none" stroke="#0c3a31" stroke-width="24" stroke-linecap="round"/>
  <path d="M98 138 C82 148 66 158 52 164" fill="none" stroke="url(#cloak)" stroke-width="18" stroke-linecap="round"/>
  <path d="M62 160 L52 165" stroke="url(#leather)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="44" cy="168" r="11" fill="#e9b58e" stroke="#b88660" stroke-width="2"/>

  <!-- hood -->
  <path d="M72 94 C70 62 90 42 116 40 C134 38 146 46 154 60 L170 74 L154 78 C156 84 156 90 154 96 C152 118 136 132 112 132 C88 132 74 116 72 94 Z" fill="url(#cloak)" stroke="#0c3a31" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 92 C84 70 98 58 114 58 C130 58 144 70 144 92 C144 112 130 124 114 124 C98 124 84 112 84 92 Z" fill="#e9b58e" stroke="#b88660" stroke-width="2"/>
  <!-- hair fringe -->
  <path d="M86 80 C92 64 106 60 120 62 C132 62 140 70 144 82 C134 76 128 74 120 76 C112 72 100 74 86 80 Z" fill="#7a4a26" stroke="#4a2c14" stroke-width="2" stroke-linejoin="round"/>
  <!-- face -->
  <ellipse cx="102" cy="94" rx="5.5" ry="7" fill="#2a2016"/>
  <ellipse cx="128" cy="94" rx="5.5" ry="7" fill="#2a2016"/>
  <circle cx="103.5" cy="91.5" r="1.8" fill="#ffffff"/>
  <circle cx="129.5" cy="91.5" r="1.8" fill="#ffffff"/>
  <path d="M104 110 Q115 118 126 110" fill="none" stroke="#7a2b1f" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="94" cy="106" rx="6" ry="4" fill="#ff7aa8" opacity="0.35"/>
  <ellipse cx="136" cy="106" rx="6" ry="4" fill="#ff7aa8" opacity="0.35"/>
</svg>
