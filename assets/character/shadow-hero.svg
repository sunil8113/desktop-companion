<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300">
  <!-- Original cartoon hooded night hero. Hangs from a grapple line held in the raised hand
       (top centre); the outstretched left hand holds the prop. -->
  <defs>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f6a"/>
      <stop offset="1" stop-color="#22253a"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#352a52"/>
      <stop offset="1" stop-color="#160f26"/>
    </linearGradient>
  </defs>

  <!-- cape, spread wide -->
  <path d="M98 122 C62 150 32 206 22 266 L58 252 L82 276 L120 258 L158 276 L182 252 L218 266 C208 206 178 150 142 122 Z" fill="url(#cape)" stroke="#07050c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100 132 C78 160 62 200 56 246 M140 132 C162 160 178 200 184 246" fill="none" stroke="#6b3fa0" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- legs, dangling -->
  <path d="M112 204 C110 226 106 242 106 260" fill="none" stroke="#0d0f1a" stroke-width="27" stroke-linecap="round"/>
  <path d="M112 204 C110 226 106 242 106 260" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <path d="M130 204 C134 224 138 238 140 254" fill="none" stroke="#0d0f1a" stroke-width="27" stroke-linecap="round"/>
  <path d="M130 204 C134 224 138 238 140 254" fill="none" stroke="url(#suit)" stroke-width="21" stroke-linecap="round"/>
  <ellipse cx="105" cy="272" rx="13" ry="10" fill="#1b1d2b" stroke="#07050c" stroke-width="3"/>
  <ellipse cx="142" cy="266" rx="13" ry="10" fill="#1b1d2b" stroke="#07050c" stroke-width="3" transform="rotate(-18 142 266)"/>

  <!-- raised arm holding the grapple (behind the head) -->
  <path d="M140 134 C146 100 132 60 122 30" fill="none" stroke="#0d0f1a" stroke-width="24" stroke-linecap="round"/>
  <path d="M140 134 C146 100 132 60 122 30" fill="none" stroke="url(#suit)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="120" cy="22" r="12" fill="#1b1d2b" stroke="#07050c" stroke-width="3"/>
  <rect x="113" y="6" width="14" height="12" rx="3" fill="#8a93a8" stroke="#07050c" stroke-width="2"/>

  <!-- torso -->
  <path d="M92 132 C92 120 104 114 120 114 C136 114 148 120 148 132 L146 196 C146 210 136 216 120 216 C104 216 94 210 94 196 Z" fill="url(#suit)" stroke="#0d0f1a" stroke-width="3"/>
  <!-- chest emblem: crescent moon -->
  <path d="M128 140 A18 18 0 1 0 128 176 A14 14 0 1 1 128 140 Z" fill="#d9deea" stroke="#7d869c" stroke-width="2"/>
  <!-- utility belt -->
  <rect x="94" y="188" width="52" height="11" rx="4" fill="#5d6276" stroke="#0d0f1a" stroke-width="2"/>
  <rect x="100" y="186" width="10" height="15" rx="2" fill="#7d8296" stroke="#0d0f1a" stroke-width="1.5"/>
  <rect x="130" y="186" width="10" height="15" rx="2" fill="#7d8296" stroke="#0d0f1a" stroke-width="1.5"/>
  <rect x="114" y="186" width="12" height="15" rx="3" fill="#c9cfdc" stroke="#0d0f1a" stroke-width="1.5"/>

  <!-- free arm, held out (holds the prop) -->
  <path d="M98 136 C80 142 62 148 46 152" fill="none" stroke="#0d0f1a" stroke-width="24" stroke-linecap="round"/>
  <path d="M98 136 C80 142 62 148 46 152" fill="none" stroke="url(#suit)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="38" cy="152" r="12" fill="#1b1d2b" stroke="#07050c" stroke-width="3"/>

  <!-- hood with a single peak -->
  <path d="M70 92 C70 60 88 44 108 38 L116 24 L124 40 C142 46 152 66 152 92 C152 116 134 130 111 130 C88 130 70 116 70 92 Z" fill="url(#suit)" stroke="#0d0f1a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 98 C86 116 98 124 111 124 C124 124 136 116 138 98 Z" fill="#e8b994" stroke="#b88660" stroke-width="2"/>
  <!-- mask with glowing eyes -->
  <path d="M78 80 C92 72 130 72 144 80 L142 98 C128 104 94 104 80 98 Z" fill="#141624" stroke="#07050c" stroke-width="2"/>
  <path d="M88 88 C94 84 102 84 106 88 C102 92 94 93 88 88 Z" fill="#f4f7ff"/>
  <path d="M116 88 C120 84 128 84 134 88 C128 93 120 92 116 88 Z" fill="#f4f7ff"/>
  <!-- smirk -->
  <path d="M102 113 Q112 118 122 111" fill="none" stroke="#7a2b1f" stroke-width="3" stroke-linecap="round"/>
</svg>
